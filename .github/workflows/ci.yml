name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  typescript-tests:
    name: TypeScript Tests (vitest & tsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Run workspace test suites (L4 Reasoning, L6 Output, L8 Orchestration)
        run: pnpm test

      - name: Run L5 Action connectors Vitest suite
        run: pnpm run test:connectors

      - name: Run L8 Orchestration scenario tests
        run: pnpm run test:orchestration

      - name: Run L18 Interaction surface tests
        run: pnpm run test:surface

  license-and-hygiene:
    name: License, Image Pinning & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies for metadata inspection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run license and compose hygiene check
        run: python scripts/check_licenses.py

      - name: Validate docker-compose configuration with required env vars
        env:
          MEILISEARCH_MASTER_KEY: ci-dummy-meili-key
          NANGO_SECRET_KEY: ci-dummy-nango-secret
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-dummy-keycloak-password
          INFISICAL_ENCRYPTION_KEY: ci-dummy-infisical-key
          LIVEKIT_KEYS: "ci-key: ci-secret"
          POSTGRES_PASSWORD: ci-dummy-postgres-password
        run: docker compose config -q

