name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run pytest
        run: python -m pytest -q

  typescript-tests:
    name: TypeScript Tests (vitest & tsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies (strict lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run workspace test suites (L4 Reasoning, L6 Output, L8 Orchestration)
        run: pnpm test

      - name: Run L5 Action connectors Vitest suite
        run: pnpm run test:connectors

      - name: Run L8 Orchestration scenario tests
        run: pnpm run test:orchestration

      - name: Run L18 Interaction surface tests
        run: pnpm run test:surface

  license-and-hygiene:
    name: License, Lockfile, Image Pinning & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-pinned Python dependencies for metadata inspection
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run license, lockfile, and compose hygiene check
        run: python scripts/check_licenses.py

      - name: Validate docker-compose configuration with required env vars
        env:
          MEILISEARCH_MASTER_KEY: ci-dummy-meili-key
          NANGO_SECRET_KEY: ci-dummy-nango-secret
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-dummy-keycloak-password
          INFISICAL_ENCRYPTION_KEY: ci-dummy-infisical-key
          LIVEKIT_KEYS: "ci-key: ci-secret"
          POSTGRES_PASSWORD: ci-dummy-postgres-password
          POSTHOG_SECRET: ci-dummy-posthog-secret
          SVIX_JWT_SECRET: ci-dummy-svix-jwt-secret
        run: docker compose config -q

  compose-e2e:
    name: Compose E2E (Qdrant v1.20, Apache AGE, Temporal, Keycloak, Valkey)
    runs-on: ubuntu-latest
    needs: [python-tests, license-and-hygiene]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run live Compose E2E test suite
        env:
          COMPOSE_E2E_AUTO_START: "1"
        run: python -m pytest -m live tests/integration/test_compose_stack_e2e.py -v -s --tb=short

      - name: Dump compose logs on failure
        if: failure()
        env:
          MEILISEARCH_MASTER_KEY: e2e-test-meili-key
          NANGO_SECRET_KEY: e2e-test-nango-secret
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: e2e-admin-pass
          INFISICAL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          LIVEKIT_KEYS: "e2ekey: e2esecret"
          POSTGRES_PASSWORD: e2e-postgres-pass
        run: |
          docker compose ps -a
          docker compose logs --tail=80 valkey qdrant apache-age temporal keycloak
