[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-intelligence"
version = "1.0.0"
description = "Central Intelligence — Aevum CI Brain (Layers 1-11)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Aevum CI Core Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "tiktoken>=0.6.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["cognitive", "control"]
asyncio_mode = "auto"
markers = [
    "live: marks tests requiring an actual browser environment (excluded from default CI)",
]
addopts = "-m 'not live'"
