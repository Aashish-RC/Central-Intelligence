[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-intelligence"
version = "1.0.0"
description = "Central Intelligence — Aevum CI Brain (Layers 1-19)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Aevum CI Core Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "tiktoken>=0.6.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "networkx>=3.2.0",
    "pypdf>=4.0.0",
    "qdrant-client>=1.8.0",
    "meilisearch>=0.30.0",
    "redis>=5.0.0",
    "temporalio>=1.7.0",
    "chromadb>=0.4.22",
    "pg8000>=1.31.0",
    "nest-asyncio>=1.5.0",
    "livekit-api>=1.2.0",
]

[project.optional-dependencies]
graph-non-osi = [
    "gqlalchemy>=1.10.0",
    "falkordb>=1.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "cognitive",
    "cognitive/memory",
    "cognitive/memory/storage",
    "cognitive/knowledge",
    "cognitive/action",
    "cognitive/output",
    "cognitive/learning",
    "control",
    "control/orchestration",
    "control/safety",
    "control/safety/guardrails",
    "control/evaluation",
    "control/context",
    "control/identity",
    "control/billing",
    "control/observability",
    "platform_infra",
    "surface/interaction",
    "surface/federation",
]
testpaths = ["cognitive", "control", "platform_infra", "surface", "tests"]
python_files = ["test_*.py"]
norecursedirs = [
    "node_modules",
    ".git",
    ".venv",
    "cognitive/knowledge/rag_api",
]
asyncio_mode = "auto"
markers = [
    "live: marks tests requiring an actual browser environment (excluded from default CI)",
    "disallow_local: marks tests disallowing local sandbox fallback",
]
addopts = "-m 'not live' -p no:phoenix"
