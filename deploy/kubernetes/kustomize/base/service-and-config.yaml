apiVersion: v1
kind: Service
metadata:
  name: central-intelligence-gateway
  labels:
    app.kubernetes.io/name: central-intelligence
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 4000
      protocol: TCP
  selector:
    app.kubernetes.io/name: central-intelligence
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: central-intelligence-config
  labels:
    app.kubernetes.io/name: central-intelligence
data:
  ENABLE_SYNTHESIS: "true"
  DEFAULT_LLM_PROVIDER: "ollama"
  EMBEDDING_BACKEND: "local"
  ADAPTER_MODE: "live"
  CI_ENVIRONMENT: "production"
  POSTGRES_HOST: "central-postgres"
  POSTGRES_PORT: "5432"
  VALKEY_HOST: "central-valkey"
  VALKEY_PORT: "6379"
