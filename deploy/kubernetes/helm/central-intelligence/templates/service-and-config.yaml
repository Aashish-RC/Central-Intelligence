apiVersion: v1
kind: Service
metadata:
  name: {{ include "central-intelligence.fullname" . }}
  labels:
    {{- include "central-intelligence.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "central-intelligence.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central-intelligence.fullname" . }}-config
  labels:
    {{- include "central-intelligence.labels" . | nindent 4 }}
data:
  ENABLE_SYNTHESIS: {{ .Values.gateway.env.ENABLE_SYNTHESIS | quote }}
  DEFAULT_LLM_PROVIDER: {{ .Values.gateway.env.DEFAULT_LLM_PROVIDER | quote }}
  EMBEDDING_BACKEND: {{ .Values.gateway.env.EMBEDDING_BACKEND | quote }}
  ADAPTER_MODE: {{ .Values.gateway.env.ADAPTER_MODE | quote }}
  CI_ENVIRONMENT: {{ .Values.gateway.env.CI_ENVIRONMENT | quote }}
  POSTGRES_HOST: {{ .Values.storage.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.storage.postgres.port | quote }}
  VALKEY_HOST: {{ .Values.storage.valkey.host | quote }}
  VALKEY_PORT: {{ .Values.storage.valkey.port | quote }}
  QDRANT_HOST: {{ .Values.storage.qdrant.host | quote }}
  QDRANT_PORT: {{ .Values.storage.qdrant.port | quote }}
  TEMPORAL_HOST: {{ .Values.storage.temporal.host | quote }}
  TEMPORAL_PORT: {{ .Values.storage.temporal.port | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "central-intelligence.fullname" . }}-secrets
  labels:
    {{- include "central-intelligence.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production-vault"
  REASONING_GATEWAY_API_KEY: "change-me-in-production-vault"
