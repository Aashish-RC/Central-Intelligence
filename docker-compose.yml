services:
  # Vector Store for Memory Engine & Embeddings (Optional/Demo profile - default uses supabase-db pgvector)
  qdrant:
    profiles: ["optional", "demo"]
    image: qdrant/qdrant:v1.20.0
    container_name: central-qdrant
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Local Model Serving for Offline / Dev Execution (MIT)
  ollama:
    profiles: ["optional"]
    image: ollama/ollama:0.40.16
    container_name: central-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Open-source High-Throughput In-Memory Cache & Pub/Sub (Valkey - OSI BSD-3-Clause)
  valkey:
    profiles: ["core", "lite", "standard", "enterprise"]
    image: valkey/valkey:8.0.2-alpine
    container_name: central-valkey
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - default
      - agpl_quarantine_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Alternative Vector Store for Offline Mode (Apache-2.0)
  chroma:
    profiles: ["optional"]
    image: chromadb/chroma:0.4.22
    container_name: central-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Graph tier is fully consolidated into supabase-db Apache AGE (Task A3)
  # Nango Federated OAuth Gateway for L5 Action
  # LICENSE NOTICE: Elastic-2.0 (source-available, non-OSI; optional profile only)
  nango:
    image: nangohq/nango-server:hosted-0.72.4
    container_name: central-nango
    profiles: ["optional"]
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "8080:8080"
    environment:
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set}
    volumes:
      - nango_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3003/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Temporal Server for L8 Durable Workflow Execution (MIT)
  temporal:
    profiles: ["core", "standard", "enterprise"]
    image: temporalio/temporal:1.10.0
    container_name: central-temporal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address localhost:7233 > /dev/null 2>&1 || grpcurl -plaintext localhost:7233 list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # OpenTelemetry Collector for L14 Observability (Apache-2.0, OSI default telemetry backend)
  otel-collector:
    profiles: ["core", "enterprise"]
    image: central-intelligence-otel-collector:0.120.0
    build:
      context: ./compose/otel
    container_name: central-otel-collector
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 48M
    ports:
      - "4317:4317"
      - "4318:4318"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./compose/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Keycloak Enterprise IAM for L12 Identity (Auth, SSO, Passkeys) (Apache-2.0)
  keycloak:
    profiles: ["core", "enterprise"]
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: central-keycloak
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # OpenFGA Zanzibar ReBAC for L12 Fine-Grained Authorization (Apache-2.0)
  openfga:
    profiles: ["core", "standard", "enterprise"]
    image: central-intelligence-openfga:v1.22.1
    build:
      context: ./compose/openfga
    container_name: central-openfga
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    command: run
    ports:
      - "8081:8080"
      - "8082:8081"
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://openfga:${OPENFGA_POSTGRES_PASSWORD:?OPENFGA_POSTGRES_PASSWORD must be set}@supabase-db:5432/openfga?sslmode=disable
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # LiveKit Real-Time WebRTC Audio/Video Server for L1 Perception (Task 1.1) (Apache-2.0)
  livekit:
    profiles: ["optional"]
    image: livekit/livekit-server:v1.13.11
    container_name: central-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:?LIVEKIT_KEYS must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Supabase Postgres + pgvector + RLS for L15 Data (Task 15.1) (Apache-2.0 / PostgreSQL)
  supabase-db:
    profiles: ["core", "lite", "standard", "enterprise"]
    image: supabase/postgres:15.1.1.78
    container_name: central-supabase-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./compose/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/01-init-multi-db.sh:ro
    networks:
      - default
      - agpl_quarantine_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # NATS JetStream Event & Messaging Broker (Task A7) (Apache-2.0)
  nats:
    profiles: ["core", "standard", "enterprise"]
    image: nats:2.10-alpine
    container_name: central-nats
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  lago-redis:
    profiles: ["core", "standard", "enterprise"]
    image: redis:6-alpine
    container_name: central-lago-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lago_redis_data:/data
    networks:
      - agpl_quarantine_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  lago-migrate:
    profiles: ["core", "standard", "enterprise"]
    image: getlago/api:v1.16.0
    container_name: central-lago-migrate
    restart: "no"
    command: ["./scripts/migrate.sh"]
    environment:
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_NAME: "Central Intelligence"
      LAGO_ORG_USER_EMAIL: "admin@central-intelligence.local"
      LAGO_ORG_USER_PASSWORD: "SuperSecurePass123!@#"
      DATABASE_URL: postgresql://lago:${LAGO_POSTGRES_PASSWORD:?LAGO_POSTGRES_PASSWORD must be set}@supabase-db:5432/lago?search_path=public
      REDIS_URL: redis://lago-redis:6379
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:?LAGO_SECRET_KEY_BASE must be set}
      RAILS_ENV: production
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:?LAGO_ENCRYPTION_PRIMARY_KEY must be set}
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:?LAGO_ENCRYPTION_DETERMINISTIC_KEY must be set}
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:?LAGO_ENCRYPTION_KEY_DERIVATION_SALT must be set}
    volumes:
      - lago_storage_data:/app/storage
    networks:
      - default
      - agpl_quarantine_net
    depends_on:
      supabase-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy

  lago:
    profiles: ["core", "standard", "enterprise"]
    image: getlago/api:v1.16.0
    container_name: central-lago
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    command: ["./scripts/start.sh"]
    ports:
      - "3002:3000"
    environment:
      - LAGO_API_URL=http://lago:3000
      - DATABASE_URL=postgresql://lago:${LAGO_POSTGRES_PASSWORD:?LAGO_POSTGRES_PASSWORD must be set}@supabase-db:5432/lago?search_path=public
      - REDIS_URL=redis://lago-redis:6379
      - SECRET_KEY_BASE=${LAGO_SECRET_KEY_BASE:?LAGO_SECRET_KEY_BASE must be set}
      - RAILS_ENV: production
      - RAILS_LOG_TO_STDOUT=true
      - LAGO_FRONT_URL=http://localhost:3002
      - LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      - RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      - LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_ENCRYPTION_PRIMARY_KEY:?LAGO_ENCRYPTION_PRIMARY_KEY must be set}
      - LAGO_ENCRYPTION_DETERMINISTIC_KEY=${LAGO_ENCRYPTION_DETERMINISTIC_KEY:?LAGO_ENCRYPTION_DETERMINISTIC_KEY must be set}
      - LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:?LAGO_ENCRYPTION_KEY_DERIVATION_SALT must be set}
      - LAGO_USE_AWS_S3=false
      - LAGO_USE_GCS=false
      - LAGO_DISABLE_SEGMENT=true
      - LAGO_REDIS_CACHE_URL=redis://lago-redis:6379
    networks:
      - default
      - agpl_quarantine_net
    depends_on:
      supabase-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
      lago-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 60s
      retries: 20
      start_period: 30s

  lago-worker:
    profiles: ["core", "standard", "enterprise"]
    image: getlago/api:v1.16.0
    container_name: central-lago-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    command: ["./scripts/start.worker.sh"]
    environment:
      - LAGO_API_URL=http://lago:3000
      - DATABASE_URL=postgresql://lago:${LAGO_POSTGRES_PASSWORD:?LAGO_POSTGRES_PASSWORD must be set}@supabase-db:5432/lago?search_path=public
      - REDIS_URL=redis://lago-redis:6379
      - SECRET_KEY_BASE=${LAGO_SECRET_KEY_BASE:?LAGO_SECRET_KEY_BASE must be set}
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      - RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY:?LAGO_RSA_PRIVATE_KEY must be set}
      - LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_ENCRYPTION_PRIMARY_KEY:?LAGO_ENCRYPTION_PRIMARY_KEY must be set}
      - LAGO_ENCRYPTION_DETERMINISTIC_KEY=${LAGO_ENCRYPTION_DETERMINISTIC_KEY:?LAGO_ENCRYPTION_DETERMINISTIC_KEY must be set}
      - LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:?LAGO_ENCRYPTION_KEY_DERIVATION_SALT must be set}
      - LAGO_FRONT_URL=http://localhost:3002
      - LAGO_USE_AWS_S3=false
      - LAGO_USE_GCS=false
      - LAGO_DISABLE_SEGMENT=true
      - LAGO_REDIS_CACHE_URL=redis://lago-redis:6379
    volumes:
      - lago_storage_data:/app/storage
    networks:
      - default
      - agpl_quarantine_net
    depends_on:
      lago:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bundle exec sidekiqmon | grep \"$$(hostname)\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20


volumes:
  qdrant_data:
  ollama_models:
  valkey_data:
  chroma_data:
  nango_data:
  temporal_data:
  keycloak_data:
  openfga_data:
  supabase_data:
  age_data:
  nats_data:
  lago_redis_data:
  lago_storage_data:

networks:
  default:
  agpl_quarantine_net:
    driver: bridge
