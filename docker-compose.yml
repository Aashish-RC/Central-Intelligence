services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: central-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage

  # Local Model Serving for Offline / Dev Execution
  ollama:
    image: ollama/ollama:latest
    container_name: central-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Global Fast Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: central-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKeyCentral2026}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # Working Memory Cache & Key-Value Store
  redis:
    image: redis:7-alpine
    container_name: central-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Alternative Vector Store for Offline Mode
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: central-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Graph Memory Tier (Tier 4)
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: central-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      - MEMGRAPH=--log-level=WARNING
    volumes:
      - memgraph_data:/var/lib/memgraph

volumes:
  qdrant_data:
  ollama_models:
  meili_data:
  redis_data:
  chroma_data:
  memgraph_data:
