services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: central-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage

  # Local Model Serving for Offline / Dev Execution (MIT)
  ollama:
    image: ollama/ollama:0.40.16
    container_name: central-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Global Fast Search Engine (MIT)
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: central-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY must be set}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # Open-source High-Throughput In-Memory Cache & Pub/Sub (Valkey - OSI BSD-3-Clause, replaces Dragonfly)
  valkey:
    image: valkey/valkey:8.0.2-alpine
    container_name: central-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  # Alternative Vector Store for Offline Mode (Apache-2.0)
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: central-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Graph Memory Tier (Tier 4) (BSL-1.1; self-hosted opt-in profile — OSI default uses supabase-db with Apache AGE)
  memgraph:
    image: memgraph/memgraph-platform:2.14.1-memgraph2.14.1-lab2.11.1
    container_name: central-memgraph
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      - MEMGRAPH=--log-level=WARNING
    volumes:
      - memgraph_data:/var/lib/memgraph

  # GraphRAG Engine for L3 Knowledge
  # LICENSE NOTICE: SSPL-v1 (non-OSI; quarantined to opt-in profile — OSI default uses supabase-db Apache AGE)
  falkordb:
    image: falkordb/falkordb:v4.22.3
    container_name: central-falkordb
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data

  # Nango Federated OAuth Gateway for L5 Action
  # LICENSE NOTICE: Elastic-2.0 (source-available, non-OSI; self-hosted opt-in profile only)
  nango:
    image: nangohq/nango-server:hosted-0.72.4
    container_name: central-nango
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "8080:8080"
    environment:
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set}
    volumes:
      - nango_data:/data

  # Temporal Server for L8 Durable Workflow Execution (MIT)
  temporal:
    image: temporalio/temporal:1.10.0
    container_name: central-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data

  # OpenTelemetry Collector for L14 Observability (Apache-2.0, OSI default telemetry backend)
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    container_name: central-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"

  # Arize Phoenix for L11 Evaluation, Hallucination Detection & Tracing
  # LICENSE NOTICE: Elastic-2.0 (source-available, non-OSI; self-hosted opt-in profile only — OSI default uses otel-collector)
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    container_name: central-phoenix
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/root/.phoenix

  # Keycloak Enterprise IAM for L12 Identity (Auth, SSO, Passkeys) (Apache-2.0)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: central-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
    volumes:
      - keycloak_data:/opt/keycloak/data

  # OpenFGA Zanzibar ReBAC for L12 Fine-Grained Authorization (Apache-2.0)
  openfga:
    image: openfga/openfga:v1.22.1
    container_name: central-openfga
    restart: unless-stopped
    command: run
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - OPENFGA_DATA_STORE_ENGINE=memory
    volumes:
      - openfga_data:/var/lib/openfga

  # Infisical Vault for L12 Secret Management & Key Rotation (MIT)
  infisical:
    image: infisical/infisical:v0.167.8
    container_name: central-infisical
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY must be set}
    volumes:
      - infisical_data:/data

  # Hyperswitch Universal Payment Router for L13 Billing (Feature 13.13) (Apache-2.0)
  hyperswitch:
    image: juspaydotin/hyperswitch-router:v1.129.0-standalone
    container_name: central-hyperswitch
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - ROUTER_PORT=8080
      - ENVIRONMENT=sandbox

  # LiveKit Real-Time WebRTC Audio/Video Server for L1 Perception (Task 1.1) (Apache-2.0)
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: central-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:?LIVEKIT_KEYS must be set}

  # Supabase Postgres + pgvector + Apache AGE + RLS for L15 Data (Task 15.1) (Apache-2.0 / PostgreSQL)
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: central-supabase-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - supabase_data:/var/lib/postgresql/data

  # Unified Project Management & Docs Workspace (Huly - Task 19.1) (EPL-2.0)
  huly:
    image: hardcoreeng/front:v0.7.432
    container_name: central-huly
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      - HULY_ENV=production
    volumes:
      - huly_data:/var/lib/huly


volumes:
  qdrant_data:
  ollama_models:
  meili_data:
  valkey_data:
  chroma_data:
  memgraph_data:
  falkordb_data:
  nango_data:
  temporal_data:
  phoenix_data:
  keycloak_data:
  openfga_data:
  infisical_data:
  supabase_data:
  huly_data:
