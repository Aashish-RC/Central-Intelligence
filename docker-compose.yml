services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: central-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage

  # Local Model Serving for Offline / Dev Execution
  ollama:
    image: ollama/ollama:latest
    container_name: central-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Global Fast Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: central-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKeyCentral2026}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # High-throughput In-Memory Cache & Pub/Sub (Dragonfly - Task 15.2)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: central-dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data

  # Alternative Vector Store for Offline Mode
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: central-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Graph Memory Tier (Tier 4)
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: central-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      - MEMGRAPH=--log-level=WARNING
    volumes:
      - memgraph_data:/var/lib/memgraph

  # GraphRAG Engine for L3 Knowledge
  falkordb:
    image: falkordb/falkordb:latest
    container_name: central-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data

  # Nango Federated OAuth Gateway for L5 Action
  nango:
    image: nangohq/nango:latest
    container_name: central-nango
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "8080:8080"
    environment:
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY:-centralIntelligenceNangoSecret}
    volumes:
      - nango_data:/data

  # Temporal Server for L8 Durable Workflow Execution
  temporal:
    image: temporalio/auto-setup:latest
    container_name: central-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal_data:/etc/temporal/config/dynamicconfig

  # Arize Phoenix for L11 Evaluation, Hallucination Detection & Tracing
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: central-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/root/.phoenix

  # Keycloak Enterprise IAM for L12 Identity (Auth, SSO, Passkeys)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: central-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak_data:/opt/keycloak/data

  # OpenFGA Zanzibar ReBAC for L12 Fine-Grained Authorization
  openfga:
    image: openfga/openfga:latest
    container_name: central-openfga
    restart: unless-stopped
    command: run
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - OPENFGA_DATA_STORE_ENGINE=memory
    volumes:
      - openfga_data:/var/lib/openfga

  # Infisical Vault for L12 Secret Management & Key Rotation
  infisical:
    image: infisical/infisical:latest
    container_name: central-infisical
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY:-centralIntelligenceInfisicalKey32BytesLong!}
    volumes:
      - infisical_data:/data

  # Hyperswitch Universal Payment Router for L13 Billing (Feature 13.13)
  hyperswitch:
    image: juspaydotin/hyperswitch:latest
    container_name: central-hyperswitch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ROUTER_PORT=8080
      - ENVIRONMENT=sandbox

  # LiveKit Real-Time WebRTC Audio/Video Server for L1 Perception (Task 1.1)
  livekit:
    image: livekit/livekit-server:latest
    container_name: central-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:-devkey: secret}

  # Supabase Postgres + pgvector + Apache AGE + RLS for L15 Data (Task 15.1)
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: central-supabase-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - supabase_data:/var/lib/postgresql/data

  # Unified Project Management & Docs Workspace (Huly - Task 19.1)
  huly:
    image: hcengineering/platform:latest
    container_name: central-huly
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - HULY_ENV=production
    volumes:
      - huly_data:/var/lib/huly


volumes:
  qdrant_data:
  ollama_models:
  meili_data:
  dragonfly_data:
  chroma_data:
  memgraph_data:
  falkordb_data:
  nango_data:
  temporal_data:
  phoenix_data:
  keycloak_data:
  openfga_data:
  infisical_data:
  supabase_data:
  huly_data:
