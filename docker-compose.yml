services:
  # Vector Store for Memory Engine & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: central-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Local Model Serving for Offline / Dev Execution (MIT)
  ollama:
    image: ollama/ollama:0.40.16
    container_name: central-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Global Fast Search Engine (MIT)
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: central-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY must be set}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Open-source High-Throughput In-Memory Cache & Pub/Sub (Valkey - OSI BSD-3-Clause, replaces Dragonfly)
  valkey:
    image: valkey/valkey:8.0.2-alpine
    container_name: central-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Alternative Vector Store for Offline Mode (Apache-2.0)
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: central-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Graph Memory Tier (Tier 4) (BSL-1.1; self-hosted opt-in profile — OSI default uses supabase-db with Apache AGE)
  memgraph:
    image: memgraph/memgraph-platform:2.14.1-memgraph2.14.1-lab2.11.1
    container_name: central-memgraph
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "3000:3000"
    environment:
      - MEMGRAPH=--log-level=WARNING
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # GraphRAG Engine for L3 Knowledge
  # LICENSE NOTICE: SSPL-v1 (non-OSI; quarantined to opt-in profile — OSI default uses supabase-db Apache AGE)
  falkordb:
    image: falkordb/falkordb:v4.22.3
    container_name: central-falkordb
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Nango Federated OAuth Gateway for L5 Action
  # LICENSE NOTICE: Elastic-2.0 (source-available, non-OSI; self-hosted opt-in profile only)
  nango:
    image: nangohq/nango-server:hosted-0.72.4
    container_name: central-nango
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "8080:8080"
    environment:
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set}
    volumes:
      - nango_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3003/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Temporal Server for L8 Durable Workflow Execution (MIT)
  temporal:
    image: temporalio/temporal:1.10.0
    container_name: central-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address localhost:7233 > /dev/null 2>&1 || grpcurl -plaintext localhost:7233 list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # OpenTelemetry Collector for L14 Observability (Apache-2.0, OSI default telemetry backend)
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    container_name: central-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext localhost:4317 list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Arize Phoenix for L11 Evaluation, Hallucination Detection & Tracing
  # LICENSE NOTICE: Elastic-2.0 (source-available, non-OSI; self-hosted opt-in profile only — OSI default uses otel-collector)
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    container_name: central-phoenix
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/root/.phoenix
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6006/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Keycloak Enterprise IAM for L12 Identity (Auth, SSO, Passkeys) (Apache-2.0)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: central-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

  # OpenFGA Zanzibar ReBAC for L12 Fine-Grained Authorization (Apache-2.0)
  openfga:
    image: openfga/openfga:v1.22.1
    container_name: central-openfga
    restart: unless-stopped
    command: run
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - OPENFGA_DATA_STORE_ENGINE=memory
    volumes:
      - openfga_data:/var/lib/openfga
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Infisical Vault for L12 Secret Management & Key Rotation (MIT)
  infisical:
    image: infisical/infisical:v0.167.8
    container_name: central-infisical
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY must be set}
    volumes:
      - infisical_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Hyperswitch Universal Payment Router for L13 Billing (Feature 13.13) (Apache-2.0)
  hyperswitch:
    image: juspaydotin/hyperswitch-router:v1.129.0-standalone
    container_name: central-hyperswitch
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - ROUTER_PORT=8080
      - ENVIRONMENT=sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # LiveKit Real-Time WebRTC Audio/Video Server for L1 Perception (Task 1.1) (Apache-2.0)
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: central-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:?LIVEKIT_KEYS must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Supabase Postgres + pgvector + RLS for L15 Data (Task 15.1) (Apache-2.0 / PostgreSQL)
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: central-supabase-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - supabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Apache AGE (PostgreSQL + OpenCypher) for L2/L3 Default Open Graph Store (Apache-2.0)
  apache-age:
    image: apache/age:release_PG16_1.6.0
    container_name: central-apache-age
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${AGE_POSTGRES_DB:-postgres}
    volumes:
      - age_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${AGE_POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Unified Project Management & Docs Workspace (Huly - Task 19.1) (EPL-2.0)
  huly:
    image: hardcoreeng/front:v0.7.432
    container_name: central-huly
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      - HULY_ENV=production
    volumes:
      - huly_data:/var/lib/huly
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Kafka Event Streaming Broker for L15 Messaging Dev/AutoMQ-compatible bus (Apache-2.0)
  kafka:
    image: apache/kafka:3.9.0
    container_name: central-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Svix Webhook Delivery Service for L15 Data & Event Webhooks (MIT)
  svix:
    image: svix/svix-server:v1.57.0
    container_name: central-svix
    restart: unless-stopped
    ports:
      - "8071:8071"
    environment:
      - SVIX_JWT_SECRET=${SVIX_JWT_SECRET:?SVIX_JWT_SECRET must be set}
      - WAIT_FOR=false
    volumes:
      - svix_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8071/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Dragonfly High-Throughput Redis-Compatible Cache (BSL-1.1; opt-in non-OSI profile; default uses valkey)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.26.1
    container_name: central-dragonfly
    profiles: ["self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # OpenMeter Real-Time Metering & Token Ingestion for L13 Billing (Apache-2.0)
  openmeter:
    image: openmeter/openmeter:v1.0.0
    container_name: central-openmeter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - OPENMETER_ADDRESS=0.0.0.0:8888
      - OPENMETER_INGEST_KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8888/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Lago Open Source Metering & Billing Engine for L13 Billing (AGPLv3 quarantined network)
  lago:
    image: getlago/api:v1.16.0
    container_name: central-lago
    profiles: ["agpl-quarantine", "self-hosted-non-osi"]
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - LAGO_REDIS_URL=redis://valkey:6379
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
    networks:
      - default
      - agpl_quarantine_net
    depends_on:
      valkey:
        condition: service_healthy
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # SigNoz APM, Distributed Tracing & Metrics for L14 Observability (MIT / Apache-2.0)
  signoz:
    image: signoz/signoz:v0.66.0
    container_name: central-signoz
    restart: unless-stopped
    ports:
      - "3301:3301"
      - "4319:4317"
    environment:
      - SIGNOZ_PORT=3301
    volumes:
      - signoz_data:/var/lib/signoz
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3301/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Uptime Kuma Self-Hosted Status & Service Monitoring for L14 Observability (MIT)
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: central-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # PostHog Product Analytics & Event Funnels for L14 Observability (MIT)
  posthog:
    image: posthog/posthog:v1.50.0
    container_name: central-posthog
    restart: unless-stopped
    ports:
      - "8095:8000"
    environment:
      - POSTHOG_SECRET=${POSTHOG_SECRET:?POSTHOG_SECRET must be set}
    volumes:
      - posthog_data:/var/lib/posthog
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/_health/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

  # Bytebase Database Schema Migration & Version Control for L17 Release (Apache-2.0)
  bytebase:
    image: bytebase/bytebase:3.2.0
    container_name: central-bytebase
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - bytebase_data:/var/opt/bytebase
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # LibreChat Multi-Provider Web Interface for L18 Interaction (MIT)
  librechat:
    image: ghcr.io/danny-avila/librechat:v0.7.7
    container_name: central-librechat
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://localhost:27017/LibreChat
    volumes:
      - librechat_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


volumes:
  qdrant_data:
  ollama_models:
  meili_data:
  valkey_data:
  chroma_data:
  memgraph_data:
  falkordb_data:
  nango_data:
  temporal_data:
  phoenix_data:
  keycloak_data:
  openfga_data:
  infisical_data:
  supabase_data:
  age_data:
  huly_data:
  kafka_data:
  svix_data:
  dragonfly_data:
  signoz_data:
  uptime_kuma_data:
  posthog_data:
  bytebase_data:
  librechat_data:

networks:
  default:
  agpl_quarantine_net:
    driver: bridge
